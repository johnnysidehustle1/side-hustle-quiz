<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Hustle Match Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div id="quiz-container" class="bg-white rounded-2xl shadow-xl p-8 max-w-md w-full fade-in">
        <!-- Progress Bar -->
        <div class="w-full bg-gray-200 rounded-full h-2 mb-8">
            <div id="progress" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 20%"></div>
        </div>

        <!-- Question Section -->
        <div id="question-content">
            <h2 id="question-text" class="text-2xl font-bold text-gray-800 mb-6 leading-tight"></h2>
            <div id="options" class="space-y-4"></div>
        </div>

        <!-- Result Section (Hidden initially) -->
        <div id="result-content" class="hidden text-center">
            <h2 class="text-3xl font-bold text-gray-900 mb-4">Your Match is Ready! 🚀</h2>
            <p class="text-gray-600 mb-8 text-lg">Based on your answers, we've identified the perfect side hustle path for you. Here are your next steps:</p>
            
            <div class="space-y-4">
                <a href="https://johnnysidehustle.gumroad.com/l/afqwug" class="block w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition transform hover:scale-105">
                    Download FREE 50 Side Hustle Ideas (PDF)
                </a>
                <p class="text-sm text-gray-500 font-medium">OR START NOW</p>
                <a href="#" class="block w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition transform hover:scale-105 shadow-lg">
                    Get 30-Day Starter Kit ($19)
                </a>
            </div>
            <p class="mt-8 text-sm text-gray-400">Join 5,000+ professionals building their freedom.</p>
        </div>
    </div>

    <script>
        const questions = [
            {
                text: "How much time can you realistically dedicate per week?",
                options: ["1-5 hours", "5-10 hours", "10-20 hours", "20+ hours"]
            },
            {
                text: "What's your primary goal right now?",
                options: ["Extra $500/mo", "Replace my 9-to-5", "Learn a new skill", "Just exploring"]
            },
            {
                text: "Which skill set feels most natural to you?",
                options: ["Writing/Creative", "Technical/Data", "Organizing/Admin", "People/Sales"]
            },
            {
                text: "What's your preferred working style?",
                options: ["Solo/Independent", "Collaborative/Team", "Client-facing", "Behind the scenes"]
            },
            {
                text: "What's your biggest roadblock right now?",
                options: ["No clear idea", "No time", "Fear of failure", "Tech overwhelm"]
            }
        ];

        let currentStep = 0;

        function showQuestion() {
            const q = questions[currentStep];
            document.getElementById('question-text').innerText = q.text;
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = "w-full text-left p-4 rounded-xl border-2 border-gray-100 hover:border-blue-500 hover:bg-blue-50 transition-all font-medium text-gray-700 hover:text-blue-700";
                btn.innerText = option;
                btn.onclick = nextStep;
                optionsDiv.appendChild(btn);
            });

            document.getElementById('progress').style.width = ((currentStep + 1) / questions.length * 100) + '%';
        }

        function nextStep() {
            if (currentStep < questions.length - 1) {
                currentStep++;
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('question-content').classList.add('hidden');
            document.getElementById('progress').parentElement.classList.add('hidden');
            document.getElementById('result-content').classList.remove('hidden');
        }

        // Initialize
        showQuestion();
    </script>
</body>
</html>
